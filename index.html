<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Rush – Case Opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d16;--p1:#111626;--p2:#171d31;--line:#232b45;--txt:#e8ecf6;--mut:#8b93ad;--acc:#ff9f1c;--ok:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;font-weight:600;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#1c2550 0%,transparent 70%),var(--bg);overflow-x:hidden}
button{font-family:inherit;font-weight:700;cursor:pointer;border:none;color:inherit}
h1,h2,h3,.rf{font-family:'Russo One',sans-serif;font-weight:400;letter-spacing:.5px}
#app{max-width:1280px;margin:0 auto;padding:12px 16px 60px}
#app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(6px,-4px)}30%,50%,70%{transform:translate(-10px,6px)}40%,60%{transform:translate(10px,-6px)}}

/* Header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;background:linear-gradient(180deg,#141a2e,#0f1424);border:1px solid var(--line);border-radius:14px;position:sticky;top:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.logo{font-family:'Russo One';font-size:24px;background:linear-gradient(90deg,#ffcc33,#ff6a1c);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo span{font-size:24px;-webkit-text-fill-color:initial}
nav{display:flex;gap:6px;margin-left:8px}
nav button{background:transparent;color:var(--mut);padding:8px 14px;border-radius:9px;font-size:16px}
nav button.on{background:var(--p2);color:#fff;box-shadow:inset 0 -2px 0 var(--acc)}
nav button .cnt{background:var(--acc);color:#111;border-radius:20px;padding:0 7px;font-size:12px;margin-left:4px}
.spacer{flex:1}
.bal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.bal small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.bal b{font-family:'Russo One';font-size:22px;color:var(--ok)}
.bal.inv b{color:#ffd166;font-size:18px}
.tog{background:var(--p2);border:1px solid var(--line);padding:7px 10px;border-radius:9px;font-size:14px;color:var(--mut)}
.tog.on{color:#fff;border-color:var(--acc)}

/* history strip */
#hist{display:flex;gap:6px;overflow:hidden;margin:12px 0;height:58px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
#hist .h{flex:0 0 86px;height:58px;border-radius:8px;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--rc) 45%,transparent),var(--p1) 70%);border-bottom:3px solid var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:hin .5s ease}
#hist .h svg{width:70px;height:28px}
#hist .h i{font-style:normal;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;max-width:80px;text-overflow:ellipsis}
#hist .empty{color:var(--mut);font-size:14px;align-self:center;padding-left:6px}
@keyframes hin{from{transform:translateX(-30px);opacity:0}}

/* Case grid */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:18px 2px 12px}
.sec-title h2{font-size:22px}
.sec-title span{color:var(--mut);font-size:15px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.case{position:relative;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.case::before{content:"";position:absolute;inset:-40% -20% auto;height:200px;background:radial-gradient(circle,color-mix(in srgb,var(--cc) 40%,transparent),transparent 65%);opacity:.55;transition:opacity .2s}
.case:hover{transform:translateY(-4px);border-color:var(--cc);box-shadow:0 10px 30px color-mix(in srgb,var(--cc) 30%,transparent)}
.case:hover::before{opacity:1}
.case:hover .crate{animation:bob 1.2s ease-in-out infinite}
.crate{width:100%;max-width:170px;height:auto;position:relative;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.case h3{font-size:16px;margin:6px 0 8px;position:relative}
.price{position:relative;display:inline-block;background:linear-gradient(180deg,#ffb21f,#ff7a00);color:#1a1000;padding:6px 16px;border-radius:9px;font-family:'Russo One';font-size:15px}
.price.free{background:linear-gradient(180deg,#4dff9a,#14b85a)}
.price.cd{background:#2a3150;color:var(--mut)}
.tag{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 8px;border-radius:20px;background:#ff2f5b;color:#fff;z-index:2}

/* Case view */
.cv-top{display:flex;align-items:center;gap:14px;margin:16px 0 10px;flex-wrap:wrap}
.back{background:var(--p2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:15px}
.back:disabled{opacity:.4;cursor:not-allowed}
.cv-top h2{font-size:26px}
.cv-top .crate{width:70px}
.reelbox{position:relative;background:linear-gradient(180deg,#0d1120,#0a0d18);border:1px solid var(--line);border-radius:16px;height:210px;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
.reelbox::before,.reelbox::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:3;pointer-events:none}
.reelbox::before{left:0;background:linear-gradient(90deg,#0a0d18,transparent)}
.reelbox::after{right:0;background:linear-gradient(270deg,#0a0d18,transparent)}
.reel{position:absolute;top:22px;left:0;display:flex;gap:6px;will-change:transform}
.reel .card{flex:0 0 140px;height:166px}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);z-index:4;box-shadow:0 0 12px var(--acc),0 0 30px var(--acc)}
.marker::before,.marker::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:10px solid transparent}
.marker::before{top:0;border-top-color:var(--acc)}
.marker::after{bottom:0;border-bottom-color:var(--acc)}
.reel .card.win{animation:winpulse .9s ease infinite;z-index:2}
@keyframes winpulse{50%{box-shadow:0 0 30px var(--rc),inset 0 0 30px color-mix(in srgb,var(--rc) 40%,transparent);transform:scale(1.04)}}
.openrow{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0 6px;flex-wrap:wrap}
.openbtn{background:linear-gradient(180deg,#ffb21f,#ff6a00);color:#1a0d00;font-family:'Russo One';font-size:20px;padding:14px 38px;border-radius:12px;box-shadow:0 6px 0 #a34400,0 10px 30px rgba(255,120,0,.35);transition:transform .1s}
.openbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34400}
.openbtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;box-shadow:none}
.openbtn.free{background:linear-gradient(180deg,#4dff9a,#14b85a);box-shadow:0 6px 0 #0b6b33,0 10px 30px rgba(20,184,90,.35)}
.hint{color:var(--mut);font-size:14px}
.odds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.odd{background:var(--p1);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:8px;padding:6px 12px;font-size:14px}
.odd b{color:var(--rc)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;border-radius:10px;background:radial-gradient(circle at 50% 110%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 70%),linear-gradient(180deg,#161c30,#10152a);border:1px solid #20283f;border-bottom:4px solid var(--rc);padding:8px 8px 10px;display:flex;flex-direction:column;overflow:hidden}
.card .cimg{height:72px;display:flex;align-items:center;justify-content:center;margin:4px 0 6px}
.wsvg{width:100%;height:100%;max-width:150px;overflow:visible}
.card.r3 .wsvg,.card.r4 .wsvg{filter:drop-shadow(0 0 6px var(--rc))}
.card.r5 .wsvg{filter:drop-shadow(0 0 8px var(--rc));animation:mshine 2.5s linear infinite}
@keyframes mshine{50%{filter:drop-shadow(0 0 14px var(--rc)) brightness(1.2)}}
.card.r5::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);background-size:250% 100%;animation:sweep 2.8s linear infinite;pointer-events:none}
@keyframes sweep{from{background-position:150% 0}to{background-position:-100% 0}}
.cw{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{font-size:11px;color:var(--rc);text-transform:uppercase;letter-spacing:.6px}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:4px}
.cval{color:var(--ok);font-family:'Russo One';font-size:14px}
.cch{font-size:12px;color:var(--mut)}
.sellb{background:#22304f;color:#cfe;font-size:12px;padding:4px 8px;border-radius:6px}
.sellb:hover{background:var(--ok);color:#002}
.kc{position:absolute;top:6px;left:6px;font-size:10px;background:#ff6a00;color:#111;padding:1px 5px;border-radius:4px}
.wr{position:absolute;top:6px;right:6px;font-size:10px;color:var(--mut);background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px}
.isnew{animation:newin .6s ease}
@keyframes newin{from{transform:scale(.6);opacity:0}}

/* inventory toolbar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.bar select,.bar .btn{background:var(--p2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:9px;font-family:inherit;font-weight:700;font-size:14px}
.bar .btn.sell{background:#13361f;border-color:#1f6b3a;color:#7dffb0}
.bar .btn.warn{background:#4a1220;border-color:#a3223f;color:#ffb3c2}
.empty-inv{text-align:center;color:var(--mut);padding:60px 10px;font-size:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat small{color:var(--mut);text-transform:uppercase;font-size:12px;letter-spacing:1px}
.stat b{display:block;font-family:'Russo One';font-size:24px;margin-top:4px}
.rbars{margin-top:14px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px}
.rb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:15px}
.rb span{width:110px;color:var(--rc)}
.rb div{flex:1;height:10px;background:#1b2138;border-radius:6px;overflow:hidden}
.rb div i{display:block;height:100%;background:var(--rc);border-radius:6px}
.rb em{font-style:normal;width:60px;text-align:right;color:var(--mut)}

/* ===== Reveal overlay ===== */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,5,10,.82);backdrop-filter:blur(4px);overflow:hidden}
.ov.show{display:flex}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.rays{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:0;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 55%,transparent) 0deg 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 12%,transparent 30%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 12%,transparent 30%);z-index:1}
.ov.go.r3 .rays,.ov.go.r4 .rays,.ov.go.r5 .rays{animation:raysin .8s ease forwards,spin 14s linear infinite}
.ov.r5 .rays{background:repeating-conic-gradient(from 0deg,#ff4d6d 0deg 6deg,transparent 6deg 12deg,#ffd84d 12deg 18deg,transparent 18deg 24deg,#4dffb0 24deg 30deg,transparent 30deg 36deg,#4dc3ff 36deg 42deg,transparent 42deg 48deg,#c44dff 48deg 54deg,transparent 54deg 60deg)}
@keyframes raysin{from{opacity:0;transform:scale(.2)}to{opacity:.6;transform:scale(1)}}
@keyframes spin{to{rotate:360deg}}
.glowbg{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;margin:-40vmin;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 60%,transparent),transparent 65%);opacity:0;z-index:1}
.ov.go .glowbg{animation:fadein .6s ease forwards,breathe 2.4s ease-in-out .6s infinite}
@keyframes fadein{to{opacity:1}}
@keyframes breathe{50%{transform:scale(1.15)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
.ov.go.r4 .flash,.ov.go.r5 .flash{animation:flash .9s ease-out}
.ov.go.r5 .flash{background:radial-gradient(circle,#fff 30%,#ffe9a8)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.rings{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none}
.rings i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:5px solid var(--rc);opacity:0;box-shadow:0 0 30px var(--rc),inset 0 0 30px var(--rc)}
.ov.go.r4 .rings i,.ov.go.r5 .rings i{animation:ring 1.4s cubic-bezier(.1,.7,.3,1) forwards}
.rings i:nth-child(2){animation-delay:.18s!important}
.rings i:nth-child(3){animation-delay:.36s!important}
@keyframes ring{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(9)}}

.sus{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#000}
.ov.sus .sus{display:flex}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--rc) 35%,transparent 70%);animation:orb .45s ease-in-out infinite alternate;display:flex;align-items:center;justify-content:center;font-family:'Russo One';font-size:54px;color:#000}
.ov.r5 .orb{animation-duration:.3s}
@keyframes orb{from{transform:scale(.7);filter:blur(1px)}to{transform:scale(1.35);filter:blur(0)}}
.sus p{position:absolute;bottom:22%;font-family:'Russo One';letter-spacing:6px;color:var(--rc);font-size:18px;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.3}}

.rv{position:relative;z-index:7;text-align:center;padding:20px;max-width:640px;width:100%;opacity:0}
.ov.go .rv{opacity:1}
.ov.r3 .rv,.ov.r4 .rv,.ov.r5 .rv{background:radial-gradient(ellipse at 50% 60%,rgba(5,7,14,.85) 0%,rgba(5,7,14,.6) 45%,transparent 72%)}
.rv-rar{font-family:'Russo One';font-size:22px;color:var(--rc);letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 20px var(--rc)}
.ov.go .rv-rar{animation:slam .7s cubic-bezier(.2,1.6,.4,1)}
.ov.r4 .rv-rar{font-size:44px}
.ov.r5 .rv-rar{font-size:60px;background:linear-gradient(90deg,#ff4d6d,#ffd84d,#4dffb0,#4dc3ff,#c44dff,#ff4d6d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(255,210,80,.8))}
.ov.go.r5 .rv-rar{animation:slam .8s cubic-bezier(.2,1.6,.4,1),rainbow 2s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
@keyframes slam{0%{transform:scale(4);opacity:0;filter:blur(10px)}100%{transform:scale(1);opacity:1}}
.rv-img{height:200px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.rv-img .wsvg{max-width:420px;filter:drop-shadow(0 0 18px var(--rc)) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.ov.go .rv-img{animation:itemin 1s cubic-bezier(.2,1.4,.4,1) .1s both}
.ov.go.r5 .rv-img .wsvg,.ov.go.r4 .rv-img .wsvg{animation:float 3s ease-in-out 1s infinite}
@keyframes itemin{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.rv-name{font-size:30px;font-family:'Russo One'}
.rv-name small{display:block;font-family:Rajdhani;font-size:18px;color:var(--mut);font-weight:700}
.rv-sub{color:var(--mut);margin-top:4px;font-size:16px}
.rv-sub .kc2{color:#ff9f1c}
.rv-val{font-family:'Russo One';font-size:40px;color:var(--ok);margin:10px 0 16px;text-shadow:0 0 20px rgba(61,220,132,.5)}
.rv-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rv-btns button{padding:12px 22px;border-radius:11px;font-size:17px}
.b-sell{background:linear-gradient(180deg,#4dff9a,#14b85a);color:#002}
.b-keep{background:#2a3355;color:#fff}
.b-again{background:linear-gradient(180deg,#ffb21f,#ff6a00);color:#1a0d00}
.ov.go.r3 .rv-btns,.ov.go.r4 .rv-btns,.ov.go.r5 .rv-btns{animation:fadein .5s ease .8s both;opacity:0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16203a;border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:200;animation:tin .3s ease;font-size:16px}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.ver{position:fixed;left:10px;bottom:8px;z-index:50;font-size:12px;color:var(--mut);background:rgba(10,13,22,.75);border:1px solid var(--line);padding:3px 9px;border-radius:7px;pointer-events:none}
.cm{position:fixed;inset:0;z-index:150;background:rgba(3,5,10,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.cm.show{display:flex}
.cm-box{position:relative;background:linear-gradient(180deg,#161c30,#0f1424);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:newin .25s ease}
.cm-x{position:absolute;top:10px;right:10px;background:var(--p2);width:34px;height:34px;border-radius:8px}
.cm h2{font-size:22px;margin-bottom:6px}
.cm h4{margin:16px 0 7px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.cm .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cm .row button,.cm input{background:var(--p2);border:1px solid var(--line);padding:8px 12px;border-radius:9px;font-size:14px;color:var(--txt);font-family:inherit;font-weight:700}
.cm .row button:hover{border-color:#4a5682}
.cm .row button.on{border-color:var(--acc);background:#3a2a10;color:#ffcf80}
.cm .row button.rar{border-color:var(--rc);color:var(--rc)}
.cm .row button.rar.on{background:var(--rc);color:#111}
.cm .row button.red{border-color:#a3223f;color:#ffb3c2}
.cm input{width:150px}
.cm .code{width:100%;font-size:22px;text-align:center;letter-spacing:4px;margin:10px 0}
.cm .go{width:100%;background:linear-gradient(180deg,#ffb21f,#ff6a00)!important;color:#1a0d00!important;font-size:17px!important;padding:12px!important}
.cm .err{color:#ff5470;font-size:14px;min-height:20px;margin-top:8px;text-align:center}
.cm .cm-sub{color:var(--mut);font-size:14px}
.hidden{display:none!important}
@media(max-width:640px){
 .logo{font-size:19px}.bal b{font-size:18px}nav{order:5;width:100%;margin:0}
 .reel .card{flex-basis:120px}.ov.r5 .rv-rar{font-size:40px}.ov.r4 .rv-rar{font-size:32px}.rv-name{font-size:22px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span>📦</span>CASE RUSH</div>
    <nav>
      <button data-tab="cases" class="on">🎁 Kisten</button>
      <button data-tab="inv">🎒 Inventar<span class="cnt" id="invCnt">0</span></button>
      <button data-tab="stats">📊 Statistik</button>
    </nav>
    <div class="spacer"></div>
    <button class="tog" id="tCheat" title="Cheat-Menü">🔑</button>
    <button class="tog" id="tFast" title="Schnelles Öffnen">⚡ Schnell</button>
    <button class="tog on" id="tSnd" title="Sound">🔊 Sound</button>
    <div class="bal inv"><small>Inventar</small><b id="invVal">0 $</b></div>
    <div class="bal"><small>Guthaben</small><b id="bal">0 $</b></div>
  </header>

  <div id="hist"></div>

  <main id="vCases"></main>
  <main id="vCase" class="hidden"></main>
  <main id="vInv" class="hidden"></main>
  <main id="vStats" class="hidden"></main>
</div>

<div class="cm" id="cm"><div class="cm-box"><button class="cm-x" id="cmX">✕</button><div id="cmBody"></div></div></div>
<div class="ver">Version 0.2 · Open Beta</div>

<div class="ov" id="ov">
  <div class="glowbg"></div>
  <div class="rays"></div>
  <div class="rings"><i></i><i></i><i></i></div>
  <canvas id="fx"></canvas>
  <div class="sus"><div class="orb">?</div><p>ES WIRD SELTEN …</p></div>
  <div class="flash"></div>
  <div class="rv">
    <div class="rv-rar" id="rvRar"></div>

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// deterministic case contents

 const R=rng(ci*9973+17), pk=a=>a[Math.floor(R()*a.length)];
 cs.items=[];const used=new Set();
 const base=cs.price||cs.ev;
 RAR.forEach((ra,ri)=>{
  const n=COUNTS[ri];const f=[];for(let i=0;i<n;i++)f.push(.45+R()*1.1);
  const avg=f.reduce((a,b)=>a+b,0)/n;
  for(let i=0;i<n;i++){
   let type,w,word,tries=0;
   do{type=pk(POOLS[ri]);w=(ri===4&&LEG[type])?pk(LEG[type]):pk(WEAP[type]);word=pk(cs.words);tries++}while(used.has(w+word)&&tries<50);
   used.add(w+word);
   const p=cs.pal.slice();for(let k=p.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[p[k],p[j]]=[p[j],p[k]]}
   cs.items.push({ci,ii:cs.items.length,r:ri,type,w,n:word,c:p.slice(0,3),pat:pk(PATS[ri]),v:Math.max(.03,r2(base*ra.mult*f[i]/avg))});
  }
 });
});

/* ================== AUDIO ================== */
let AC=null;
function ac(){if(!S.snd)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type='sine',vol=.15,when=0,to){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol=.4,when=0,lp=900){const a=ac();if(!a)return;const t=a.currentTime+when,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start(t)}
const sTick=()=>tone(1500+Math.random()*300,.035,'square',.035);
function sWin(ri){
 const sets=[[523],[523,659],[523,659,784],[523,659,784,1047],[392,523,659,784,1047],[523,659,784,1047,1319,1568]];
 sets[ri].forEach((f,i)=>tone(f,ri>=4?1.1:.45,ri>=3?'sawtooth':'triangle',ri>=4?.07:.1,i*.08));
 if(ri>=4){sets[ri].forEach(f=>tone(f/2,1.8,'triangle',.08,.5));}
}
function sRiser(ri){const d=ri===5?1.7:.9;tone(120,d,'sawtooth',.06,0,1400);tone(60,d,'sine',.15,0,240);for(let i=0;i<(ri===5?6:3);i++)tone(55,.2,'sine',.45,i*(d/(ri===5?6:3)))}
function sBoom(){noise(1.4,.7,0,500);tone(70,1,'sine',.5,0,30)}

function probs(){const L=S.luck||1,w=RAR.map((r,i)=>r.p*(i>=3?L:1)),s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s)}
function rollRarity(boost){
 if(!boost&&S.force!=null){const f=S.force;if(!S.forceAlways)S.force=null;return f}
 const w=boost?RAR.map((r,i)=>r.p*(i>=3?4:1)):probs(),s=w.reduce((a,b)=>a+b,0);let x=Math.random()*s;
 for(let i=0;i<w.length;i++){if((x-=w[i])<0)return i}return 0;
}
function rollItem(ci,boost){const ri=rollRarity(boost),arr=CASES[ci].items.filter(t=>t.r===ri);return arr[Math.floor(Math.random()*arr.length)]}
function rollWear(){let x=Math.random();for(let i=0;i<WEAR.length;i++){if((x-=WEAR[i].p)<0)return i}return 2}

const N=62,WIN=54;
function fillReel(win){
 const ci=curCase,list=[];
 for(let i=0;i<N;i++)list.push(rollItem(ci,true));
 if(win){
  list[WIN]=win;
  // near miss tease
  if(win.r<4&&Math.random()<.35){const rare=CASES[ci].items.filter(t=>t.r>=4);list[WIN+(Math.random()<.5?1:-1)]=rare[Math.floor(Math.random()*rare.length)]}
 }
 const reel=$('#reel');reel.innerHTML=list.map(t=>cardHTML(t)).join('');
 const w=$('#reelbox').clientWidth,step=CW()+GAP;
 reel.style.transform=`translateX(${-(4*step-w/2+CW()/2)}px)`;
 return list;
}
function openCase(){
 if(spinning)return;const ci=curCase,cs=CASES[ci];
 if(cs.price){if(!S.inf){if(S.bal<cs.price)return;S.bal=r2(S.bal-cs.price);S.st.spent+=cs.price}}
 else{if(freeLeft()>0)return;S.lastFree=Date.now()}
 ac();
 const t=rollItem(ci,false);
 const inst={uid:S.uid++,ci,ii:t.ii,w:rollWear(),kc:Math.random()<.1&&t.type!=='knife'?1:0,ts:Date.now()};
 if(t.type==='knife')inst.kc=Math.random()<.1?1:0;
 // commit immediately so a reload can't lose it
 S.inv.unshift(inst);S.st.opened++;S.st.rc[t.r]++;const v=val(inst);S.st.won+=v;
 if(!S.st.best||v>val(S.st.best))S.st.best=inst;
 save();
 spinning=true;renderTop();
 const b=$('#openBtn');b.disabled=true;b.textContent='🎰 Öffne …';$('#backBtn').disabled=true;$('#openHint').textContent='';
 fillReel(t);
 const reel=$('#reel'),cards=reel.children,w=$('#reelbox').clientWidth,cw=CW(),step=cw+GAP;
 const startX=4*step-w/2+cw/2;
 const endX=WIN*step+(8+Math.random()*(cw-16))-w/2;
 const dur=S.fast?1500:6500,t0=performance.now();let last=-1;
 function frame(n){
  const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,4.2);
  const x=startX+(endX-startX)*e;
  reel.style.transform=`translateX(${-x}px)`;
  const idx=Math.floor((x+w/2)/step);if(idx!==last){last=idx;sTick()}
  if(k<1)requestAnimationFrame(frame);
  else{cards[WIN].classList.add('win');setTimeout(()=>finish(inst),S.fast?250:650)}
 }
 requestAnimationFrame(frame);
}
function finish(inst){
 spinning=false;$('#backBtn').disabled=false;
 S.hist.unshift({ci:inst.ci,ii:inst.ii});S.hist=S.hist.slice(0,24);save();
 renderHist();updOpenBtn();reveal(inst);
}

/* ================== REVEAL ================== */
const ov=$('#ov'),cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false,rainColors=null,curInst=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function reveal(inst){
 curInst=inst;const t=tpl(inst),ri=t.r,v=val(inst);
 ov.style.setProperty('--rc',RAR[ri].color);
 ov.className='ov show r'+ri;void ov.offsetWidth;
 $('#rvRar').textContent=ri>=4?RAR[ri].name+'!':RAR[ri].name;
 $('#rvImg').innerHTML=svgFor(t);
 $('#rvName').innerHTML=`<small>${t.w}</small>${t.n}`;
 $('#rvSub').innerHTML=`${WEAR[inst.w].n}${inst.kc?' · <span class="kc2">⚡ KillCounter</span>':''}`;
 $('#rvVal').textContent=fmt(0);
 $('#bSell').textContent=`💰 Verkaufen ${fmt(v)}`;
 const cs=CASES[curCase];$('#bAgain').classList.toggle('hidden',!(cs.price?(S.inf||S.bal>=cs.price):freeLeft()===0));
 startFx();
 if(ri>=4){ov.classList.add('sus');sRiser(ri);await wait(ri===5?1800:1000);ov.classList.remove('sus')}
 ov.classList.add('go');
 if(ri>=4){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');sBoom()}
 sWin(ri);burst(ri);
 rainColors=ri===5?['#ff4d6d','#ffd84d','#4dffb0','#4dc3ff','#c44dff','#fff']:ri===4?[RAR[4].color,'#ffd84d','#fff']:null;
 const t0=performance.now(),D=ri>=4?1600:600;
 (function cu(n){const k=Math.min(1,(n-t0)/D);$('#rvVal').textContent=fmt(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(cu)})(t0);
 if(ri>=3)setTimeout(()=>{if(ov.classList.contains('show'))burst(ri)},700);
 if(ri===5)setTimeout(()=>{if(ov.classList.contains('show')){burst(5);sWin(5)}},1500);
}
function closeOv(){ov.className='ov';fxOn=false;rainColors=null;parts=[];renderTop();if(tab==='inv')renderInv()}
$('#bKeep').onclick=()=>{closeOv();toast('🎒 Ins Inventar gelegt')};
$('#bSell').onclick=()=>{sellUids([curInst.uid]);closeOv()};
$('#bAgain').onclick=()=>{closeOv();openCase()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('show'))$('#bKeep').click()});

function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',resize);resize();
function burst(ri){
 const n=[18,30,60,110,200,320][ri],W=cv.width,H=cv.height,dp=devicePixelRatio;
 const cols=ri===5?['#ff4d6d','#ffd84d','#4dffb0','#4dc3ff','#c44dff','#fff','#ffc400']:[RAR[ri].color,'#fff',RAR[ri].color];
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*(ri>=4?16:9))*dp;
  parts.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*dp,l:1,d:.008+Math.random()*.015,c:cols[i%cols.length],sz:(2+Math.random()*4)*dp,k:Math.random()<.45&&ri>=3?'cf':'sp',rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
}
function startFx(){if(fxOn)return;fxOn=true;requestAnimationFrame(loop)}
function loop(){
 if(!fxOn){cx.clearRect(0,0,cv.width,cv.height);return}
 const W=cv.width,H=cv.height,dp=devicePixelRatio;cx.clearRect(0,0,W,H);
 if(rainColors&&ov.classList.contains('go')&&Math.random()<.9)for(let i=0;i<(rainColors.length>3?3:1);i++)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2*dp,vy:(2+Math.random()*3)*dp,l:1,d:.003,c:rainColors[Math.floor(Math.random()*rainColors.length)],sz:(3+Math.random()*4)*dp,k:'cf',rot:Math.random()*6,vr:(Math.random()-.5)*.3});
 // ambient embers
 if(ov.classList.contains('go')&&Math.random()<.4)parts.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.75,vx:(Math.random()-.5)*dp,vy:-(1+Math.random()*2)*dp,l:1,d:.01,c:getComputedStyle(ov).getPropertyValue('--rc'),sz:2*dp,k:'sp'});
 parts=parts.filter(p=>p.l>0&&p.y<H+40);
 for(const p of parts){
  p.x+=p.vx;p.y+=p.vy;p.vy+=(p.k==='cf'?.08:.18)*dp;p.vx*=.985;p.l-=p.d;
  cx.globalAlpha=Math.max(0,Math.min(1,p.l*1.4));cx.fillStyle=p.c;
  if(p.k==='cf'){p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.sz,-p.sz/2.5,p.sz*2,p.sz/1.25*Math.abs(Math.cos(p.rot*2))+1);cx.restore()}
  else{cx.shadowBlur=12*dp;cx.shadowColor=p.c;cx.beginPath();cx.arc(p.x,p.y,p.sz/2,0,7);cx.fill();cx.shadowBlur=0}
 }
 cx.globalAlpha=1;requestAnimationFrame(loop);
}

/* ================== INVENTORY ================== */
let sortBy='new',filt='all',confirmAll=0;
function sellUids(uids){
 const set=new Set(uids);let sum=0,n=0;
 S.inv=S.inv.filter(i=>{if(set.has(i.uid)){sum+=val(i);n++;return false}return true});
 if(!n)return;S.bal=r2(S.bal+sum);S.st.sold+=sum;save();renderTop();if(curCase!==null)updOpenBtn();
 toast(`💰 ${n} Skin${n>1?'s':''} verkauft: +${fmt(sum)}`);
}
function renderInv(){
 let arr=S.inv.slice();
 if(filt!=='all')arr=arr.filter(i=>tpl(i).r===+filt);
 if(sortBy==='val')arr.sort((a,b)=>val(b)-val(a));
 if(sortBy==='rar')arr.sort((a,b)=>tpl(b).r-tpl(a).r||val(b)-val(a));
 const total=arr.reduce((a,i)=>a+val(i),0);
 $('#vInv').innerHTML=`<div class="sec-title"><h2>Inventar</h2><span>${S.inv.length} Skins · ${fmt(S.inv.reduce((a,i)=>a+val(i),0))}</span></div>
 <div class="bar">
  <select id="sSort"><option value="new">Neueste zuerst</option><option value="val">Wert ↓</option><option value="rar">Seltenheit ↓</option></select>
  <select id="sFilt"><option value="all">Alle Seltenheiten</option>${RAR.map((r,i)=>`<option value="${i}">${r.name}</option>`).join('')}</select>
  <div class="spacer"></div>
  <button class="btn sell" id="sellLow">Gewöhnlich + Selten verkaufen</button>
  <button class="btn warn" id="sellAll">${confirmAll?'⚠️ Sicher? Nochmal klicken':`Angezeigte verkaufen (${fmt(total)})`}</button>
 </div>
 ${arr.length?`<div class="grid">${arr.map(i=>cardHTML(tpl(i),`<div class="cfoot"><span class="cval">${fmt(val(i))}</span><button class="sellb" data-u="${i.uid}">Verkaufen</button></div>`,i)).join('')}</div>`:`<div class="empty-inv">🎒 Hier ist noch nichts.<br>Öffne ein paar Kisten!</div>`}`;
 $('#sSort').value=sortBy;$('#sFilt').value=filt;
 $('#sSort').onchange=e=>{sortBy=e.target.value;renderInv()};
 $('#sFilt').onchange=e=>{filt=e.target.value;renderInv()};
 $('#sellLow').onclick=()=>{sellUids(S.inv.filter(i=>tpl(i).r<=1).map(i=>i.uid));renderInv()};
 $('#sellAll').onclick=()=>{if(!arr.length)return;if(!confirmAll){confirmAll=1;renderInv();setTimeout(()=>{if(confirmAll){confirmAll=0;if(tab==='inv')renderInv()}},3000);return}confirmAll=0;sellUids(arr.map(i=>i.uid));renderInv()};
 document.querySelectorAll('.sellb').forEach(b=>b.onclick=()=>{sellUids([+b.dataset.u]);renderInv()});
}

/* ================== STATS ================== */
let confirmReset=0;
function renderStats(){
 const st=S.st,profit=S.bal+S.inv.reduce((a,i)=>a+val(i),0)-50,tot=st.opened||1;
 $('#vStats').innerHTML=`<div class="sec-title"><h2>Statistik</h2></div>
 <div class="stats">
  <div class="stat"><small>Kisten geöffnet</small><b>${st.opened}</b></div>
  <div class="stat"><small>Ausgegeben</small><b>${fmt(st.spent)}</b></div>
  <div class="stat"><small>Wert aller Drops</small><b>${fmt(st.won)}</b></div>
  <div class="stat"><small>Verkauft für</small><b>${fmt(st.sold)}</b></div>
  <div class="stat"><small>Gewinn/Verlust gesamt</small><b style="color:${profit>=0?'var(--ok)':'#ff5470'}">${profit>=0?'+':''}${fmt(profit)}</b></div>
 </div>
 ${st.best?`<div class="sec-title"><h2>🏆 Bester Drop</h2></div><div class="grid" style="max-width:220px">${cardHTML(tpl(st.best),`<div class="cfoot"><span class="cval">${fmt(val(st.best))}</span></div>`,st.best)}</div>`:''}
 <div class="rbars">${RAR.map((r,i)=>`<div class="rb" style="--rc:${r.color}"><span>${r.name}</span><div><i style="width:${st.rc[i]/tot*100}%"></i></div><em>${st.rc[i]}×</em></div>`).join('')}</div>
 <div class="bar"><button class="btn warn" id="reset">${confirmReset?'⚠️ Wirklich alles zurücksetzen?':'🔄 Spielstand zurücksetzen'}</button></div>`;
 $('#reset').onclick=()=>{if(!confirmReset){confirmReset=1;renderStats();return}confirmReset=0;const snd=S.snd,fast=S.fast;S={bal:50,inv:[],lastFree:0,hist:[],uid:1,fast,snd,cheat:S.cheat,luck:1,force:null,forceAlways:false,inf:false,st:{opened:0,spent:0,won:0,sold:0,rc:[0,0,0,0,0,0],best:null}};shownBal=50;save();renderTop();renderHist();renderStats();toast('Neustart mit 50 $')};
}

/* ================== TOGGLES / INIT ================== */
function updTog(){$('#tCheat').classList.toggle('on',!!S.cheat);$('#tFast').classList.toggle('on',S.fast);$('#tSnd').classList.toggle('on',S.snd);$('#tSnd').textContent=S.snd?'🔊 Sound':'🔇 Sound'}
$('#tFast').onclick=()=>{S.fast=!S.fast;save();updTog()};
$('#tSnd').onclick=()=>{S.snd=!S.snd;save();updTog()};
/* ================== CHEAT-MENÜ ================== */
const cm=$('#cm');let cmClear=0;
function openCm(){if(spinning)return;cmClear=0;renderCm();cm.classList.add('show');const i=$('#cmCode');if(i)setTimeout(()=>i.focus(),50)}
function closeCm(){cm.classList.remove('show');updTog();if(tab==='case'&&!spinning)openCaseView(curCase);else if(tab==='inv')renderInv();else if(tab==='cases')renderCases()}
function cmDone(msg){save();renderTop();renderCm();updTog();if(msg)toast(msg)}
function giveRand(r){const pool=[];CASES.forEach(c=>c.items.forEach(t=>{if(t.r===r)pool.push(t)}));const t=pool[Math.floor(Math.random()*pool.length)];S.inv.unshift({uid:S.uid++,ci:t.ci,ii:t.ii,w:0,kc:t.type==='knife'?0:1,ts:Date.now()});return t}
function renderCm(){
 const b=$('#cmBody');
 if(!S.cheat){
  b.innerHTML=`<h2>🔑 Code eingeben</h2><div class="cm-sub">Gib den geheimen Code ein, um das Cheat-Menü freizuschalten.</div>
  <form id="cmForm"><div class="row"><input class="code" id="cmCode" autocomplete="off" placeholder="••••"></div><div class="row"><button class="go">🔓 Freischalten</button></div><div class="err" id="cmErr"></div></form>`;
  $('#cmForm').onsubmit=e=>{e.preventDefault();const v=$('#cmCode').value.trim();
   if(v.toLowerCase()==='till'){S.cheat=true;cmDone('🛠️ Cheat-Menü freigeschaltet!');tone(660,.15,'triangle',.15);tone(990,.3,'triangle',.15,.12)}
   else{$('#cmErr').textContent='❌ Falscher Code';$('#cmCode').value='';tone(160,.25,'square',.08)}};
  return;
 }
 b.innerHTML=`<h2>🛠️ Cheat-Menü</h2><div class="cm-sub">Guthaben: <b style="color:var(--ok)">${fmt(S.bal)}</b></div>
 <h4>💵 Geld</h4>
 <div class="row">${[1000,10000,100000,1000000].map(v=>`<button data-add="${v}">+${v.toLocaleString('de-DE')} $</button>`).join('')}</div>
 <div class="row" style="margin-top:6px"><input type="number" id="cmSet" placeholder="Betrag" min="0"><button id="cmSetB">Guthaben setzen</button></div>
 <div class="row" style="margin-top:6px"><button id="cmInf" class="${S.inf?'on':''}">♾️ Unendlich Geld: ${S.inf?'AN':'AUS'}</button></div>
 <h4>🍀 Glück (Episch, Legendär & Mythisch öfter)</h4>
 <div class="row">${[1,2,5,10,50].map(v=>`<button data-luck="${v}" class="${S.luck===v?'on':''}">×${v}</button>`).join('')}</div>
 <h4>🎯 Drop erzwingen</h4>
 <div class="row"><button data-force="-1" class="${S.force==null?'on':''}">Aus</button>${RAR.map((r,i)=>`<button class="rar ${S.force===i?'on':''}" style="--rc:${r.color}" data-force="${i}">${r.name}</button>`).join('')}</div>
 <div class="row" style="margin-top:6px"><button id="cmAlways" class="${S.forceAlways?'on':''}">🔁 ${S.forceAlways?'Bei jeder Kiste':'Nur nächste Kiste'}</button></div>
 <h4>⚡ Sonstiges</h4>
 <div class="row"><button id="cmFree">⏱️ Gratis-Kiste sofort bereit</button><button id="cmMyth">🟡 Mythischen Skin geben</button><button id="cmLeg">🔴 Legendären Skin geben</button></div>
 <div class="row" style="margin-top:6px"><button class="red" id="cmClear">${cmClear?'⚠️ Sicher? Nochmal klicken':'🗑️ Inventar leeren'}</button><button class="red" id="cmLock">🔒 Cheat-Menü sperren</button></div>`;
 b.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{S.bal=r2(S.bal+ +x.dataset.add);cmDone(`💵 +${fmt(+x.dataset.add)}`)});
 $('#cmSetB').onclick=()=>{const v=parseFloat($('#cmSet').value);if(isNaN(v)||v<0)return;S.bal=r2(v);cmDone(`💵 Guthaben: ${fmt(S.bal)}`)};
 $('#cmInf').onclick=()=>{S.inf=!S.inf;cmDone(S.inf?'♾️ Unendlich Geld AN':'♾️ Unendlich Geld AUS')};
 b.querySelectorAll('[data-luck]').forEach(x=>x.onclick=()=>{S.luck=+x.dataset.luck;cmDone(`🍀 Glück ×${S.luck}`)});
 b.querySelectorAll('[data-force]').forEach(x=>x.onclick=()=>{const v=+x.dataset.force;S.force=v<0?null:v;cmDone(v<0?'🎯 Erzwingen aus':`🎯 ${RAR[v].name} erzwungen`)});
 $('#cmAlways').onclick=()=>{S.forceAlways=!S.forceAlways;cmDone()};
 $('#cmFree').onclick=()=>{S.lastFree=0;cmDone('⏱️ Gratis-Kiste ist bereit')};
 $('#cmMyth').onclick=()=>{const t=giveRand(5);cmDone(`🟡 ${t.w} | ${t.n} ins Inventar`)};
 $('#cmLeg').onclick=()=>{const t=giveRand(4);cmDone(`🔴 ${t.w} | ${t.n} ins Inventar`)};
 $('#cmClear').onclick=()=>{if(!cmClear){cmClear=1;renderCm();return}cmClear=0;S.inv=[];cmDone('🗑️ Inventar geleert')};
 $('#cmLock').onclick=()=>{S.cheat=false;S.inf=false;S.luck=1;S.force=null;S.forceAlways=false;cmDone('🔒 Cheat-Menü gesperrt')};
}
$('#tCheat').onclick=openCm;$('#cmX').onclick=closeCm;
cm.addEventListener('click',e=>{if(e.target===cm)closeCm()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&cm.classList.contains('show'))closeCm()});

updTog();renderTop();renderHist();show('cases');
</script>
</body>
